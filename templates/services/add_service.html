{% extends 'base.html' %}
{% block title %}Add Service - OTO DriveCare{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow p-4">
                <h4 class="fw-bold mb-4"><i class="fas fa-plus-circle me-2 text-warning"></i>Add New Service</h4>
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
                    </div>
                    {% endfor %}
                    <div class="d-flex gap-2 mt-2">
                        <button type="submit" class="btn btn-warning fw-bold flex-grow-1">Add Service</button>
                        <a href="{% url 'providers:provider_dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
