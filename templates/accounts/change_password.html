{% extends 'base.html' %}
{% block title %}Change Password - OTO DriveCare{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow p-4">
                <h4 class="fw-bold mb-4 text-center"><i class="fas fa-lock me-2 text-warning"></i>Change Password</h4>
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
                    </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-warning w-100 fw-bold">Update Password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
